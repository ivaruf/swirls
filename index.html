<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05040F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>swirls</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #c {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    #label {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(44px + env(safe-area-inset-bottom, 0px));
      text-align: center;
      font-size: 12px;
      line-height: 1.4;
      letter-spacing: 0.3em;
      text-transform: lowercase;
      color: rgba(255, 255, 255, 0.65);
      opacity: 0;
      transition: opacity 0.45s ease;
      pointer-events: none;
    }

    #hint {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(22px + env(safe-area-inset-bottom, 0px));
      text-align: center;
      font-size: 10px;
      line-height: 1.4;
      letter-spacing: 0.2em;
      text-transform: lowercase;
      color: rgba(255, 255, 255, 0.35);
      opacity: 0;
      transition: opacity 0.45s ease;
      pointer-events: none;
    }

    #label.visible,
    #hint.visible {
      opacity: 1;
    }

    #next, #gear {
      position: fixed;
      bottom: calc(8px + env(safe-area-inset-bottom, 0px));
      display: block;
      background: none;
      border: none;
      margin: 0;
      color: #fff;
      opacity: 0.4;
      line-height: 1;
      cursor: pointer;
      transition: opacity 0.3s ease;
      -webkit-tap-highlight-color: transparent;
    }

    #next {
      right: calc(8px + env(safe-area-inset-right, 0px));
      padding: 8px 14px;
      font-size: 26px;
    }

    #gear {
      right: calc(52px + env(safe-area-inset-right, 0px));
      padding: 12px;
      z-index: 30; /* above the open menu so it can toggle it closed */
    }

    #gear svg { display: block; }

    @media (hover: hover) {
      #next:hover, #gear:hover { opacity: 0.8; }
    }

    #menu {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.45);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    #menu.open {
      opacity: 1;
      visibility: visible;
    }

    #menu-panel {
      box-sizing: border-box;
      width: min(320px, calc(100vw - 24px));
      max-height: calc(100vh - 24px);
      overflow-y: auto;
      padding: 14px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: rgba(8, 10, 13, 0.82);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
    }

    .menu-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      margin: 0;
      padding: 7px 7px 9px;
      background: none;
      border: 1px solid transparent;
      border-radius: 10px;
      font-family: inherit;
      color: rgba(255, 255, 255, 0.8);
      opacity: 0.6;
      cursor: pointer;
      transition: opacity 0.25s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .menu-cell.current {
      opacity: 1;
      border-color: rgba(255, 255, 255, 0.35);
    }

    @media (hover: hover) {
      .menu-cell:hover { opacity: 1; }
    }

    .menu-thumb {
      display: block;
      width: 100%;
      border-radius: 7px;
      background: #05080a;
      pointer-events: none;
    }

    div.menu-thumb { padding-top: 100%; }

    .menu-cell span {
      font-size: 9px;
      line-height: 1.4;
      letter-spacing: 0.18em;
      text-transform: lowercase;
      text-align: center;
    }

    #error {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      letter-spacing: 0.2em;
      color: rgba(255, 255, 255, 0.5);
      pointer-events: none;
    }

    #error.show { display: flex; }

    /* Boot splash: the logo's spectrum vortex, drawn in CSS so it paints
       before any script runs. Purely decorative — pointer-events stay off
       for its whole life, so it can never swallow a cast. main.js fades and
       removes it once the first effect is live. */
    #splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 47%,
          #151233 0%, #0C0A22 38%, #070615 72%, #03030A 100%);
      opacity: 1;
      transition: opacity 0.5s ease;
      pointer-events: none;
    }

    #splash.gone { opacity: 0; }

    #splash-mark {
      position: relative;
      width: 92px;
      height: 92px;
      margin-bottom: 30px;
    }

    /* the seven arms, one hue per effect family */
    #splash-mark::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: conic-gradient(from 200deg,
        #3FE0CC, #5CB6FF, #A87CFF, #FF6FAE,
        #FF8534, #FFCC4D, #5CDF7C, #3FE0CC);
      -webkit-mask: radial-gradient(circle closest-side, transparent 50%, #000 62%);
      mask: radial-gradient(circle closest-side, transparent 50%, #000 62%);
      filter: blur(1px);
      opacity: 0.9;
      animation: splash-spin 3.8s linear infinite;
    }

    /* the breathing core */
    #splash-mark::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 22px;
      height: 22px;
      margin: -11px 0 0 -11px;
      border-radius: 50%;
      background: radial-gradient(circle,
        #fff 0%, #FFEFCF 42%, rgba(255, 214, 140, 0) 72%);
      animation: splash-breathe 2.6s ease-in-out infinite;
    }

    #splash-word {
      font-size: 12px;
      letter-spacing: 0.3em;
      text-transform: lowercase;
      color: rgba(255, 255, 255, 0.55);
    }

    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }

    @keyframes splash-breathe {
      0%, 100% { transform: scale(0.85); opacity: 0.75; }
      50%      { transform: scale(1.12); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      #splash-mark::before, #splash-mark::after { animation: none; }
    }
  </style>
<!-- A way back to the arcade, but only when the arcade is what framed us:
     standalone this adds nothing at all. Classic and deferred on purpose, so
     /arcade/ being unreachable costs a button rather than the whole page. -->
<script src="../arcade/exit.js" defer></script>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="label"></div>
  <div id="hint">tap or drag to cast &middot; hold to charge &middot; &rsaquo; changes mode</div>
  <button id="next" type="button" aria-label="next effect">&rsaquo;</button>
  <button id="gear" type="button" aria-label="effect menu">
    <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
      <circle cx="10" cy="10" r="4.5"/>
      <circle cx="10" cy="10" r="1.5"/>
      <line x1="15.5" y1="10" x2="17.5" y2="10"/>
      <line x1="13.89" y1="13.89" x2="15.3" y2="15.3"/>
      <line x1="10" y1="15.5" x2="10" y2="17.5"/>
      <line x1="6.11" y1="13.89" x2="4.7" y2="15.3"/>
      <line x1="4.5" y1="10" x2="2.5" y2="10"/>
      <line x1="6.11" y1="6.11" x2="4.7" y2="4.7"/>
      <line x1="10" y1="4.5" x2="10" y2="2.5"/>
      <line x1="13.89" y1="6.11" x2="15.3" y2="4.7"/>
    </svg>
  </button>
  <div id="menu" aria-hidden="true">
    <div id="menu-panel"></div>
  </div>
  <div id="error">no effects loaded</div>
  <div id="splash" aria-hidden="true">
    <div id="splash-mark"></div>
    <div id="splash-word">swirls</div>
  </div>
  <script src="effects.js"></script>
  <script src="main.js"></script>
</body>
</html>
