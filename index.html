<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05040F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>swirls</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #c {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    #label {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(44px + env(safe-area-inset-bottom, 0px));
      text-align: center;
      font-size: 12px;
      line-height: 1.4;
      letter-spacing: 0.3em;
      text-transform: lowercase;
      color: rgba(255, 255, 255, 0.65);
      opacity: 0;
      transition: opacity 0.45s ease;
      pointer-events: none;
    }

    #hint {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(22px + env(safe-area-inset-bottom, 0px));
      text-align: center;
      font-size: 10px;
      line-height: 1.4;
      letter-spacing: 0.2em;
      text-transform: lowercase;
      color: rgba(255, 255, 255, 0.35);
      opacity: 0;
      transition: opacity 0.45s ease;
      pointer-events: none;
    }

    #label.visible,
    #hint.visible {
      opacity: 1;
    }

    /* ---- the two arrows, bottom right -------------------------------------
       There was one, and a gear beside it opening the effect menu. The gear
       is gone — three bars in the corner are the menu now, and nothing should
       be in two places — so its spot is where the BACKWARD arrow went. You
       can step either way along the twelve without opening anything.

       They are peers, so they are one size, and that is a fixed box rather
       than padding around a glyph: ‹ and › do not have the same advance width
       in any font, so `padding: 8px 14px` on both would have come out as two
       buttons of two widths sitting next to each other. The flex row gives
       them one gap as well, the same way #corner-tools does above. */
    #cast-tools {
      position: fixed;
      z-index: 30;
      bottom: calc(8px + env(safe-area-inset-bottom, 0px));
      right: calc(8px + env(safe-area-inset-right, 0px));
      display: flex;
      gap: 6px;
    }

    .arrow {
      font-size: 26px;
      line-height: 1;
    }

    #menu {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      /* Above the title screen (50), because the panel now holds the two
         volumes and the way out as well as the effects, and all three are
         wanted before anything has been cast. #corner-tools sits above this
         in turn, so the plate that opened it can close it again. */
      z-index: 70;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.45);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    #menu.open {
      opacity: 1;
      visibility: visible;
    }

    /* THE ONE PANEL. Three blocks down one column: the twelve effects, the
       two volumes, the way out. There were two panels until this release —
       this one and a #sound overlay behind a speaker in the corner — which
       was two doors into the same drawer.

       `width` subtracts the safe-area insets as well as the margin, because
       sideways on a notched phone those are 44px a side and a panel sized off
       bare vw runs underneath them. */
    #menu-panel {
      box-sizing: border-box;
      width: min(340px, calc(100vw - 24px
                 - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
      max-height: calc(100vh - 24px);
      /* The safety net, not the plan — see the landscape block at the foot of
         this stylesheet, which is what actually keeps this off the scroll. */
      overflow-y: auto;
      padding: 14px;
      display: grid;
      gap: 10px;
      background: rgba(8, 10, 13, 0.82);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
    }

    #menu-panel:focus { outline: none; }

    /* ---- the ring ----------------------------------------------------------
       The twelve effects laid around the mark, thirty degrees apart. It was a
       four-by-three grid of thumbnails, which is a shape any application could
       have; a ring around this particular logo could only be swirls. Twelve is
       what makes it work — a clock face, no awkward remainder — and what makes
       it honest is that everything in it is still a real button in document
       order, so Tab walks the ring clockwise from noon and the arrow keys walk
       it either way. Only the DRAWING is radial.

       THE RADIUS COMES OUT OF THE TOUCH TARGET, not the other way round.
       Adjacent cells sit 2R·sin(15°) apart on the rim, so the radius that
       leaves twelve --cell discs a --gap between them is (cell+gap)/2·sin15°,
       which is the calc below. Pick a diameter first and you find out
       afterwards whether a finger fits. */
    #menu-effects {
      --cell: 48px;
      --gap: 8px;
      --ring: calc((var(--cell) + var(--gap)) / 0.5176);
      position: relative;
      width: calc(2 * var(--ring) + var(--cell));
      height: calc(2 * var(--ring) + var(--cell));
      margin: 0 auto;
    }

    .menu-cell {
      position: absolute;
      top: 50%;
      left: 50%;
      width: var(--cell);
      height: var(--cell);
      /* half the cell back, so `top/left: 50%` means its CENTRE is on the
         container's centre before the transform carries it out to the rim. */
      margin: calc(var(--cell) / -2) 0 0 calc(var(--cell) / -2);
      padding: 0;
      background: none;
      border: 0;
      border-radius: 50%;
      /* the portraits are square; this is what makes them discs. swirls has no
         straight line anywhere else in it. */
      overflow: hidden;
      font-family: inherit;
      color: rgba(255, 255, 255, 0.8);
      opacity: 0.55;
      cursor: pointer;
      transition: opacity 0.25s ease, box-shadow 0.25s ease;
      -webkit-tap-highlight-color: transparent;
      /* out to the rim at --a, then the same angle back: a portrait tipped a
         hundred and fifty degrees is a portrait nobody can read. --a is
         written per cell by makeCell. */
      transform:
        rotate(var(--a, 0deg))
        translateY(calc(-1 * var(--ring)))
        rotate(calc(-1 * var(--a, 0deg)));
    }

    /* A ring rather than a border, because a border would have to come out of
       the cell's own width and every disc would be a different size to the
       one beside it. An outer box-shadow is not clipped by the overflow
       above, so it draws cleanly outside the disc.

       LOUDER THAN A HIGHLIGHT USUALLY NEEDS TO BE, because this marking is
       now doing a second job. The ring is the title screen, so the disc it
       lights is the answer to "carry on with the one I had last time" — there
       is no resume button and there should not be one, which means a returning
       player has to be able to find their effect without looking for it. Halo
       as well as ring: over twelve portraits that are themselves bright, a
       thin hairline disappears. */
    .menu-cell.current {
      opacity: 1;
      box-shadow:
        0 0 0 2px rgba(255, 255, 255, 0.85),
        0 0 16px rgba(255, 255, 255, 0.25);
    }

    .menu-cell:focus-visible {
      opacity: 1;
      outline: 2px solid rgba(255, 255, 255, 0.6);
      outline-offset: 2px;
    }

    /* ---- the middle of the ring --------------------------------------------
       The mark, and under it the name of whichever effect you are pointing at.
       Twelve names will not fit around a rim and trying is how radial menus
       become unreadable, so the ring carries the pictures and the centre
       carries the word — which also gives the logo something to do besides
       sit there.

       It takes no pointer events at all: everything here is an echo of a
       button on the rim, and a dead spot in the middle of a ring you are
       reaching across would swallow presses meant for the far side. It is
       aria-hidden for the same reason — a screen reader is already being told
       the name of the button that has focus, and this would say it twice. */
    #ring-centre {
      position: absolute;
      top: 50%;
      left: 50%;
      width: calc(2 * var(--ring) - var(--cell) - 16px);
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      text-align: center;
    }

    #ring-name {
      min-height: 1.4em;
      font-size: 11px;
      line-height: 1.4;
      letter-spacing: 0.18em;
      text-transform: lowercase;
      color: rgba(255, 255, 255, 0.75);
    }

    /* Leaving swirls, across the foot of the panel and under a hairline. Lower
       case and unhurried like everything else here; it is a way out, not a
       decision the panel wants to push you towards. */
    .menu-exit {
      margin: 0;
      padding: 11px 7px 4px;
      background: none;
      border: 0;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font: inherit;
      font-size: 13px;
      letter-spacing: 0.02em;
      color: rgba(255, 255, 255, 0.5);
      cursor: pointer;
      transition: color 0.25s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .menu-exit:disabled { cursor: default; }

    @media (hover: hover) {
      .menu-exit:not(:disabled):hover { color: rgba(255, 255, 255, 0.9); }
    }

    @media (hover: hover) {
      .menu-cell:hover { opacity: 1; }
    }

    /* The portraits are rendered square and fill the disc the cell already
       clips them to. `div.menu-thumb` is makeCell's fallback when a portrait
       threw — it gets the same disc, in the dark the effects are drawn on. */
    .menu-thumb {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #05080a;
      pointer-events: none;
    }

    #error {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      letter-spacing: 0.2em;
      color: rgba(255, 255, 255, 0.5);
      pointer-events: none;
    }

    #error.show { display: flex; }

    /* Boot splash: the logo's spectrum vortex, drawn in CSS so it paints
       before any script runs. Purely decorative — pointer-events stay off
       for its whole life, so it can never swallow a cast. main.js fades and
       removes it once the first effect is live. */
    #splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 47%,
          #151233 0%, #0C0A22 38%, #070615 72%, #03030A 100%);
      opacity: 1;
      transition: opacity 0.5s ease;
      pointer-events: none;
    }

    #splash.gone { opacity: 0; }

    /* THE MARK, DRAWN ONCE. It was #splash-mark and only ever appeared on the
       title screen; the menu's ring stands the twelve effects around the same
       drawing, so it is a class now and the two places that want it differ
       only in --mark. A second hand-copied vortex would have been a second
       thing to keep in step, and they would have drifted the first time
       anybody touched a hue. */
    .mark {
      --mark: 92px;
      position: relative;
      width: var(--mark);
      height: var(--mark);
    }

    #splash-mark { margin-bottom: 30px; }

    /* the seven arms, one hue per effect family */
    .mark::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: conic-gradient(from 200deg,
        #3FE0CC, #5CB6FF, #A87CFF, #FF6FAE,
        #FF8534, #FFCC4D, #5CDF7C, #3FE0CC);
      -webkit-mask: radial-gradient(circle closest-side, transparent 50%, #000 62%);
      mask: radial-gradient(circle closest-side, transparent 50%, #000 62%);
      filter: blur(1px);
      opacity: 0.9;
      animation: splash-spin 3.8s linear infinite;
    }

    /* the breathing core. Sized off --mark rather than the 22px it used to be,
       so the ring's smaller copy breathes in proportion instead of carrying a
       core two-fifths of its own width. */
    .mark::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: calc(var(--mark) * 0.24);
      height: calc(var(--mark) * 0.24);
      margin: calc(var(--mark) * -0.12) 0 0 calc(var(--mark) * -0.12);
      border-radius: 50%;
      background: radial-gradient(circle,
        #fff 0%, #FFEFCF 42%, rgba(255, 214, 140, 0) 72%);
      animation: splash-breathe 2.6s ease-in-out infinite;
    }

    #ring-mark { --mark: 64px; }

    /* Nothing spins behind a closed door. The panel is only `visibility:
       hidden` when shut, which does not stop an animation, and a conic
       gradient repainting forever behind a menu nobody has opened is work the
       effect on screen could be doing instead. */
    #menu:not(.open) #ring-mark::before,
    #menu:not(.open) #ring-mark::after { animation-play-state: paused; }

    #splash-word {
      font-size: 12px;
      letter-spacing: 0.3em;
      text-transform: lowercase;
      color: rgba(255, 255, 255, 0.55);
    }

    /* THERE IS NO `begin` BUTTON ANY MORE, and there are no styles here for
       one. The splash used to ARM into a title screen — pointer events on, a
       pill saying "begin", a way out underneath — and all of that is gone,
       because the ring is the title screen now. You begin by choosing which
       of the twelve to begin with, which is the decision anybody was going to
       make one press later anyway; a door in front of it was a press that
       asked nothing.

       So the splash is a curtain for its whole life again, exactly what it
       was before the title screen existed: CSS that paints before a line of
       script runs, pointer-events:none throughout, taken away by main.js the
       moment the ring can be shown instead. */

    /* ---- the corner: menu, mute, fullscreen --------------------------------
       Three plates, reading left to right, so fullscreen is the one in the
       actual corner. Arbitrary, and meant to be: it only has to be the same
       in every cabinet, and it is the hub's order now.

       ON EVERY SCREEN, above the title screen included — filling the screen
       and silencing the room are both things you might want to do BEFORE
       beginning. Top right is free here: swirls' own controls, the arrows,
       have always lived along the bottom edge, so this cluster never has to
       argue with them for a corner.

       The three are three kinds of thing and that is the whole shape.
       Fullscreen changes the window, mute changes the sound, and only the
       menu touches the piece — it is the one that opens a door. */
    #corner-tools {
      position: fixed;
      /* Above #menu (70), so the plate that opened the panel can close it
         again and mute stays live while it is up. */
      z-index: 80;
      top: calc(8px + env(safe-area-inset-top, 0px));
      right: calc(8px + env(safe-area-inset-right, 0px));
      display: flex;
      gap: 6px;
    }

    /* ONE PLATE, FIVE BUTTONS. The corner's three and the two arrows along the
       bottom all wear it: a disc of the panel's own surface, the same frosting
       and the same hairline, so the chrome of this game reads as one set
       rather than as a ring here and a bare glyph there. Dark and low
       contrast on purpose — swirls is a thing you watch, and its controls
       should be findable without ever being the brightest thing on screen. */
    .icon-button {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 0;
      background: rgba(8, 10, 13, 0.55);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 50%;
      font-family: inherit;
      color: rgba(255, 255, 255, 0.55);
      cursor: pointer;
      transition: color 0.3s ease, border-color 0.3s ease;
      -webkit-tap-highlight-color: transparent;
    }

    /* `hidden` is only a presentation hint and loses to any rule that sets
       `display`, which the flex above does — so without this the fullscreen
       button would appear on precisely the browser it exists to hide from. */
    .icon-button[hidden] { display: none; }

    .icon-button svg { display: block; width: 22px; height: 22px; }

    .icon-button:focus-visible {
      color: #fff;
      outline: 1px solid rgba(255, 255, 255, 0.5);
      outline-offset: 2px;
    }

    @media (hover: hover) {
      .icon-button:hover {
        color: rgba(255, 255, 255, 0.9);
        border-color: rgba(255, 255, 255, 0.16);
      }
    }

    /* The menu plate stays above the open panel and a second press shuts it,
       so it carries the panel's state — aria-expanded, which is also what a
       screen reader needs to hear. Lit while the panel is up, because a
       control that is the only way back out should look like it is doing
       something. */
    #menu-open[aria-expanded="true"] {
      color: rgba(255, 255, 255, 0.9);
      border-color: rgba(255, 255, 255, 0.16);
    }

    /* One glyph or the other, never both, and aria-pressed is the single
       source of truth for which: screen.js writes it, this reads it, so the
       picture cannot drift from what the label says. */
    #screen-toggle .icon-on { display: none; }
    #screen-toggle[aria-pressed="true"] .icon-off { display: none; }
    #screen-toggle[aria-pressed="true"] .icon-on { display: block; }

    /* The mute plate carries both its states in the one <svg> and lets this
       pick between them off the same aria-pressed main.js writes the label
       from — so what is engraved and what a screen reader hears cannot drift.
       Muted takes the violet off the volume thumbs rather than going brighter:
       this plate is lit because something is OFF, and the one other place in
       swirls wearing that colour is the pair of faders behind the menu. */
    .icon-button .icon-slash { display: none; }
    #mute-toggle[aria-pressed="true"] .icon-waves { display: none; }
    #mute-toggle[aria-pressed="true"] .icon-slash { display: block; }
    #mute-toggle[aria-pressed="true"] { color: #A87CFF; }

    /* ---- the sound half of the panel --------------------------------------
       It was an overlay of its own behind a speaker in the corner until this
       release. Two doors into the same drawer: the effects were behind one
       and the levels behind the other, and a player looking for "the
       settings" had to know which. One panel now, and this is the block
       under the thumbnails. */
    #menu-sound {
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    #menu-sound-title {
      margin: 0 0 10px;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.3em;
      color: rgba(255, 255, 255, 0.5);
    }

    /* Label, fader, number. Every label is the same width, so both faders
       start at the same x and the two rows read as one control rather than as
       two unrelated ones. */
    .vol-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 10px;
      font-size: 13px;
      cursor: pointer;
    }

    .vol-label {
      flex: 0 0 56px;
      color: rgba(255, 255, 255, 0.6);
    }

    .vol-out {
      flex: 0 0 26px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: rgba(255, 255, 255, 0.4);
    }

    /* 34px of height for a 2px line, because the height is the touch target
       and a finger is the pointer this game expects. */
    .vol-row input[type="range"] {
      flex: 1 1 0;
      min-width: 0;
      height: 34px;
      margin: 0;
      background: none;
      -webkit-appearance: none;
      appearance: none;
      cursor: pointer;
    }

    .vol-row input[type="range"]:focus { outline: none; }

    .vol-row input[type="range"]:focus-visible::-webkit-slider-thumb {
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.35);
    }

    .vol-row input[type="range"]::-webkit-slider-runnable-track {
      height: 2px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.18);
    }

    .vol-row input[type="range"]::-moz-range-track {
      height: 2px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.18);
    }

    /* The thumb takes one of the seven hues off the mark above it. */
    .vol-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      margin-top: -7px;
      border: 0;
      border-radius: 50%;
      background: #A87CFF;
    }

    .vol-row input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border: 0;
      border-radius: 50%;
      background: #A87CFF;
    }

    .vol-note {
      margin: 8px 0 0;
      font-size: 12px;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.42);
    }

    /* A ring is a fixed block rather than something that reflows, so the one
       width it cannot cope with is a phone narrower than itself. 264px of ring
       inside a 296px panel is two pixels of slack a rounding error could eat,
       so the oldest phones still in circulation get a smaller one. The radius
       follows --cell on its own; nothing else here needs saying twice. */
    @media (max-width: 359px) {
      #menu-effects { --cell: 42px; --gap: 6px; }
      #ring-mark { --mark: 56px; }
    }

    /* A phone on its side is 300–430px tall and a browser toolbar can take
       fifty of those, so what runs off the bottom is whatever is last in the
       column — which here is the way out.
       maxgear's shape, laid over the existing markup by grid AREA: nothing
       moves in the body below, portrait is untouched, and a tablet — taller
       than 500px whichever way up — keeps the stacked panel. */
    @media (orientation: landscape) and (max-height: 500px) {
      #splash-mark { --mark: 60px; margin-bottom: 16px; }

      /* THE PANEL IS THE REAL RISK IN THIS GAME and this block is the answer.
         A circle is height-hungry and a sideways phone is exactly what it has
         least of: the ring, two faders and a way out stacked as one column is
         well over 400px against a 300px viewport. A sideways phone has width
         where it lacks height, so it spends width — the ring takes a column
         of its own and the two levels and the exit stack beside it. */
      #menu-panel {
        width: min(560px, calc(100vw - 24px
                   - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
        /* `auto` and not a fraction. The ring is a fixed block now rather than
           a grid that would spend whatever it was given, so a 1.6fr column
           left it centred in a lake of empty space with the faders squeezed
           beside it. The ring asks for exactly its own 208px; everything left
           over goes to the column that can actually use width. */
        grid-template-columns: auto minmax(0, 1fr);
        grid-template-areas:
          "effects sound"
          "effects exit";
        align-content: start;
        gap: 8px 18px;
        padding: 12px;
      }
      /* align-self, because this cell spans both rows and the column beside it
         is the taller of the two — without it the ring's box stretches and the
         circle stops being centred in what the eye reads as its own space. */
      #menu-effects {
        grid-area: effects;
        align-self: start;
        /* THIRTY-EIGHT, AND NO LOWER. This query only ever fires on a phone,
           where a finger is still the pointer, and it is the hub's floor. It
           is also what decides the whole thing: twelve 38px discs 6px apart is
           a 208px ring, which is the height of the column beside it, so the
           panel comes out no taller than it was before the ring existed. */
        --cell: 38px;
        --gap: 6px;
      }
      #ring-mark { --mark: 44px; }
      #ring-centre { gap: 6px; }
      #ring-name { font-size: 10px; letter-spacing: 0.12em; }
      /* The hairline separated two blocks in a stack; sideways they are two
         columns and it would cap one of them for no reason. */
      #menu-sound { grid-area: sound; padding-top: 0; border-top: 0; }
      /* The exit is built by main.js and appended last, so it would otherwise
         auto-place into the effects column on top of the ring. It names its
         cell, like every other block here. */
      .menu-exit { grid-area: exit; align-self: end; }

      #menu-sound-title { margin-bottom: 8px; padding-top: 6px; }
      .vol-row { margin-bottom: 4px; }
      /* Thirty, and no lower: this query only ever fires on a phone, where a
         finger is still the pointer. */
      .vol-row input[type="range"] { height: 30px; }
      .vol-note { margin-top: 6px; line-height: 1.5; }
    }

    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }

    @keyframes splash-breathe {
      0%, 100% { transform: scale(0.85); opacity: 0.75; }
      50%      { transform: scale(1.12); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .mark::before, .mark::after { animation: none; }
    }
  </style>
<!-- What quitting means here: back to the arcade when the arcade is what
     framed us, closing the window when we are installed, and an honest note
     when we are a tab no script may close. It draws nothing — the button is
     ours. Classic and deferred on purpose, so /arcade/ being unreachable
     costs the quit button rather than the whole page. -->
<script src="../arcade/exit.js" defer></script>
<!-- The address change. Inert until gophercloud.games answers; see the file. -->
<script src="moved.js" defer></script>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="label"></div>
  <div id="hint">tap or drag to cast &middot; hold to charge &middot; &lsaquo; &rsaquo; change mode</div>

  <!--
    BOTH WAYS ALONG THE TWELVE, without opening anything. There was one arrow
    and a gear beside it; the gear's job belongs to the menu plate in the
    corner now, and its place along the bottom edge belongs to the arrow that
    goes the other way.

    Both call main.js's switchEffect, which is the same path ArrowLeft and
    ArrowRight already took — so a press of either dismisses the first-run
    hint and sounds the mode cue exactly as a keystroke does.
  -->
  <div id="cast-tools">
    <button id="prev" type="button" class="icon-button arrow" aria-label="previous effect" title="previous effect">&lsaquo;</button>
    <button id="next" type="button" class="icon-button arrow" aria-label="next effect" title="next effect">&rsaquo;</button>
  </div>

  <!--
    THE ONE PANEL, behind the menu plate in the corner. There were two until
    this release: this grid of effects, opened by a gear at the bottom right,
    and a #sound overlay of two faders opened by a speaker at the top right.
    Two doors into the same drawer, and a player looking for "the settings"
    had to already know which one held what.

    In order: every effect as a live portrait, laid around the mark so you can
    JUMP rather than step; the two levels; the way out of swirls. The exit is
    appended by main.js, and only when the arcade's exit.js has answered AND
    has somewhere to send us — see makeExitButton, which asks
    framed()/standalone() for a reason worth reading before changing.

    NO CLOSE BUTTON, on purpose. The plate that opened it stays visible above
    it and carries aria-expanded, tapping the dimmed backdrop closes, and so
    does Escape — which is what this menu has always done. A fourth way out
    would be a row of height on the one screen that has least to spare.
  -->
  <div id="menu" aria-hidden="true">
    <div id="menu-panel" role="dialog" aria-label="swirls menu" tabindex="-1">
      <!--
        THE RING. main.js appends the twelve effects after this centre piece,
        so document order is noon-then-clockwise and Tab walks the ring the
        way you read it. role=radiogroup because that is what it is: twelve
        alternatives, one of them current, and the arrow keys move around it
        without committing — the name under the mark previews where you are
        and Space or Enter is what actually changes the piece.
      -->
      <div id="menu-effects" role="radiogroup" aria-label="effect">
        <div id="ring-centre" aria-hidden="true">
          <div id="ring-mark" class="mark"></div>
          <div id="ring-name"></div>
        </div>
      </div>
      <div id="menu-sound">
        <h2 id="menu-sound-title">sound</h2>
        <label class="vol-row" for="vol-music">
          <span class="vol-label">music</span>
          <input type="range" id="vol-music" min="0" max="100" step="1" value="0">
          <output class="vol-out" id="vol-music-out" for="vol-music">0</output>
        </label>
        <label class="vol-row" for="vol-sfx">
          <span class="vol-label">effects</span>
          <input type="range" id="vol-sfx" min="0" max="100" step="1" value="0">
          <output class="vol-out" id="vol-sfx-out" for="vol-sfx">0</output>
        </label>
        <!-- Both faders start at zero and that is the whole of the off switch:
             swirls says nothing until one of them comes up, and until then it
             has not even fetched a sound to say it with. The markup says 0 as
             well as the script does, so the panel never flashes a level
             nobody chose. -->
        <p class="vol-note">swirls starts silent. bring music up for the theme,
          effects up and every cast rings.</p>
      </div>
    </div>
  </div>
  <div id="error">no effects loaded</div>

  <!--
    THE CORNER: menu, mute, fullscreen — three plates, reading left to right,
    with fullscreen outermost at the corner itself. fishtank's shape, the set
    maxgear and neonfox arrived at from the other end, and the hub's order.
    None of the three belongs to a particular effect, none is a setting of the
    piece you are watching, and a symbol survives being shrunk to a corner
    where a word does not.

    ON EVERY SCREEN, the title screen included — filling the screen and
    silencing the room are both things you might want before beginning. Top
    right is free here: swirls' own controls, the arrows, have always lived
    along the bottom edge, so this cluster never has to argue for the corner.

    THE FIRST TWO ARE DIFFERENT IN KIND and that is the point of drawing them
    side by side. The MENU plate opens the panel below — the effects, the two
    levels, the way out. The MUTE plate touches nothing but the sound: one
    press for silence, no panel opened, no focus moved, nothing about the
    piece disturbed, mid-cast included. Somebody walking into the room is not
    a reason to lose what is on screen. M does the same from the keyboard.

    Art carries the meaning, so each button carries a real aria-label and
    title. screen.js rewrites the fullscreen one as the state changes and
    main.js rewrites mute's — a label is the only thing that can tell a
    screen reader which way a toggle is pointing, and in both cases CSS swaps
    the picture off the same aria-pressed, so the two cannot drift.
  -->
  <div id="corner-tools">
    <!-- THREE BARS AND NOT A GEAR. A gear says settings, and what opens behind
         this holds the twelve effects and the way out of swirls as well. It
         was a speaker until this release, when the faders stopped being a
         door of their own and moved inside the one panel it opens. -->
    <button type="button" id="menu-open" class="icon-button"
            aria-expanded="false" aria-controls="menu-panel" aria-label="menu" title="menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h16"/>
      </svg>
    </button>
    <!-- MUTE, and a toggle rather than a door. The two levels behind the menu
         keep whatever they were set to while it is down — audio.js puts this
         on a master gain ABOVE both of them, not a pair of zeroes written
         over the mix — so unmuting gives back exactly what was set. -->
    <button type="button" id="mute-toggle" class="icon-button"
            aria-pressed="false" aria-label="mute" title="mute (m)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M11 5 6 9H3v6h3l5 4Z"/>
        <path class="icon-waves" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/>
        <path class="icon-slash" d="m15.5 9.5 6 5m0-5-6 5"/>
      </svg>
    </button>
    <!-- Hidden until screen.js has confirmed this browser has element
         fullscreen at all — iPhone Safari does not, and a button that does
         nothing when pressed is worse than no button. -->
    <button type="button" id="screen-toggle" class="icon-button"
            aria-pressed="false" aria-label="fullscreen" title="fullscreen" hidden>
      <!-- Four corners pushing out, and the same four pulled in for the
           pressed state. CSS shows one and hides the other. -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path class="icon-off" d="M9 3H3v6m12-6h6v6M3 15v6h6m12-6v6h-6"/>
        <path class="icon-on" d="M3 9h6V3M21 9h-6V3M3 15h6v6M21 15h-6v6"/>
      </svg>
    </button>
  </div>

  <!--
    THE BOOT CURTAIN, and nothing more than that. It is CSS over an empty
    canvas, drawn before a line of script has run, pointer-events:none for its
    whole life so a tap landing during boot can never press something nothing
    has wired up yet.

    It used to become the title screen: main.js armed it, a `begin` pill faded
    in and a way out appeared underneath. The ring is the title screen now
    (#menu-panel, above) — main.js takes this away and opens that instead, so
    the first thing a player touches is the choice of which effect to begin
    with rather than a door in front of it. The mark survives the change in
    both places; .mark is the one drawing and --mark is all that differs.
  -->
  <div id="splash" aria-hidden="true">
    <div id="splash-mark" class="mark"></div>
    <div id="splash-word">swirls</div>
  </div>
  <script src="effects.js"></script>
  <script src="screen.js" defer></script>
  <!-- Before main.js, which reads window.SwirlsAudio — and guarded there, so
       this one going missing costs the sound and nothing else. -->
  <script src="audio.js"></script>
  <script src="main.js"></script>
</body>
</html>
